<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momhandmade 系列編織 - 雲端同步商店</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto+Sans+TC', sans-serif; background-color: #fcfbfa; color: #4a403a; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- 頂部導覽 -->
  <header class="bg-white border-b border-stone-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wider text-stone-800">🧶 Momhandmade.系列編織</h1>
      <button onclick="openCart()" class="relative bg-stone-100 hover:bg-stone-200 px-3 py-1.5 rounded-full text-sm font-medium transition flex items-center gap-1.5">
        🛒 購物車 <span id="cartCount" class="bg-amber-700 text-white text-xs px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">
    <div class="mb-6 bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-900">
      ✨ 歡迎來到手作小舖！所有商品皆為溫暖純手工製作，支援客製化配色。下單後資料將同步至雲端系統！
    </div>

    <!-- 商品列表 -->
    <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      <!-- 動態載入商品 -->
    </div>
  </main>

  <!-- 購物車/結帳互動視窗 (簡化版示意) -->
  <div id="cartModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h3 class="text-lg font-bold">🛒 您的購物車</h3>
        <button onclick="closeCart()" class="text-stone-400 hover:text-stone-600 font-bold">✕</button>
      </div>
      <div id="cartItems" class="space-y-4 mb-4"></div>
      <div id="checkoutForm" class="space-y-3 border-t pt-4">
        <h4 class="font-bold text-stone-700">收件與匯款資訊</h4>
        <input type="text" id="custName" placeholder="真實姓名" class="w-full border rounded-lg p-2 text-sm">
        <input type="text" id="custPhone" placeholder="手機號碼" class="w-full border rounded-lg p-2 text-sm">
        <input type="email" id="custEmail" placeholder="電子信箱" class="w-full border rounded-lg p-2 text-sm">
        <input type="text" id="remitLast5" placeholder="匯款帳號末五碼" class="w-full border rounded-lg p-2 text-sm">
        <button onclick="submitOrder()" class="w-full bg-amber-800 hover:bg-amber-900 text-white py-2.5 rounded-xl font-medium transition">確認送出訂單</button>
      </div>
    </div>
  </div>

  <!-- 頁尾 -->
  <footer class="bg-white border-t border-stone-200 text-center py-4 text-xs text-stone-500 mt-12">
    © 2026 Momhandmade.系列編織 All Rights Reserved.
  </footer>

  <script>
    // 您的 Google Apps Script 雲端 API 網址
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx39dndfCuoG2tIGEIxa1oIlvej4MPug0V5F6RVBdY73PtdOymhh7uHeNK0gz9mlt7URg/exec';

    // 預設商品清單
    let products = [
      { id: 1, name: "小雛菊花朵收納袋", price: 280, icon: "🌼", shape: "flower", images: [] },
      { id: 2, name: "包粽御守(內可放幸運物)", price: 350, icon: "🍙", shape: "zongzi", images: [] },
      { id: 3, name: "立體花束造型杯墊", price: 450, icon: "💐", shape: "flower", images: [] },
      { id: 4, name: "小熊造型編織杯墊", price: 80, icon: "🧸", shape: "bear", images: [] },
      { id: 5, name: "松鼠造型杯墊", price: 280, icon: "👀", shape: "bear", images: [] },
      { id: 6, name: "小包粽與布蕉綠吊飾", price: 120, icon: "🌽", shape: "zongzi", images: [] }
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById('productList');
      container.innerHTML = products.map(p => `
        <div class="bg-white border border-stone-200 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
          <div>
            <div class="text-4xl mb-3">${p.icon}</div>
            <h3 class="font-bold text-stone-800 text-lg mb-1">${p.name}</h3>
            <p class="text-amber-800 font-bold mb-4">NT$ ${p.price}</p>
          </div>
          <button onclick="addToCart(${p.id})" class="bg-stone-800 hover:bg-stone-900 text-white text-sm py-2 rounded-xl transition">加入購物車</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const p = products.find(x => x.id === id);
      cart.push(p);
      document.getElementById('cartCount').innerText = cart.length;
      alert(`已將 ${p.name} 加入購物車！`);
    }

    function openCart() {
      document.getElementById('cartModal').classList.remove('hidden');
      const itemsContainer = document.getElementById('cartItems');
      if (cart.length === 0) {
        itemsContainer.innerHTML = '<p class="text-stone-400 text-center py-4">購物車是空的～</p>';
      } else {
        itemsContainer.innerHTML = cart.map((item, idx) => `
          <div class="flex justify-between items-center text-sm border-b pb-2">
            <span>${item.icon} ${item.name}</span>
            <span class="font-bold">NT$ ${item.price}</span>
          </div>
        `).join('');
      }
    }

    function closeCart() {
      document.getElementById('cartModal').classList.add('hidden');
    }

    async function submitOrder() {
      if (cart.length === 0) { alert('購物車是空的！'); return; }
      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      if (!name || !phone) { alert('請填寫姓名與電話！'); return; }

      const orderData = {
        type: 'order',
        orderNo: 'MH' + Math.floor(100000 + Math.random() * 900000),
        createdAt: new Date().toLocaleString(),
        customerName: name,
        customerPhone: phone,
        customerEmail: document.getElementById('custEmail').value,
        remitLast5: document.getElementById('remitLast5').value,
        shippingMethod: '超商取貨',
        shippingDetail: '標準配送',
        items: cart,
        subtotal: cart.reduce((sum, i) => sum + i.price, 0),
        shipFee: 60,
        total: cart.reduce((sum, i) => sum + i.price, 0) + 60,
        status: '待確認匯款'
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        alert('訂單已成功送出並同步至雲端試算表！');
        cart = [];
        document.getElementById('cartCount').innerText = 0;
        closeCart();
      } catch(e) {
        alert('送出發生錯誤，請稍後再試。');
      }
    }

    renderProducts();
  </script>
</body>
</html>
